name: Native core

on:
  pull_request:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025-vs2026
            cpu: x64
          - name: Windows ARM64
            os: windows-11-vs2026-arm
            cpu: arm64
          - name: macOS 27 ARM64
            os: xcode-27
            cpu: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
      - name: Install pinned build tools
        shell: pwsh
        run: ./tools/Install-NativeBuildTools.ps1 -Directory "${{ runner.temp }}/lumarecode-build-tools"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Managed source formatting
        if: runner.os == 'Windows' && matrix.cpu == 'x64'
        shell: pwsh
        run: |
          dotnet format Interop/LumaRecode.Native.csproj --verify-no-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format Core/LumaRecode.Core.csproj --verify-no-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format qa/NativeCoreChecks/NativeCoreChecks.csproj --verify-no-changes
          exit $LASTEXITCODE
      - name: Rust formatting and lints
        shell: pwsh
        run: |
          cargo fmt --all --manifest-path engine/rust/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path engine/rust/Cargo.toml --workspace --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Build and test Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Build-NativeCore.ps1 -Target Native -Configuration Release -Test
      - name: Build and test macOS core
        if: runner.os == 'macOS'
        run: sh tools/build-native-core.sh Release
      - name: Install pinned media test tools
        shell: pwsh
        run: ./tools/Install-MediaTestTools.ps1 -Directory "${{ runner.temp }}/lumarecode-media-tools"
      - name: Managed/native differential checks
        env:
          LUMA_REQUIRE_MEDIA_TOOLS: '1'
        shell: pwsh
        run: |
          $library = if ($IsWindows) { 'LumaRecodeCore.dll' } else { 'libLumaRecodeCore.dylib' }
          dotnet run --project qa/NativeCoreChecks/NativeCoreChecks.csproj -c Release -- "out/native-${{ matrix.cpu }}-release/engine/$library"
          exit $LASTEXITCODE
      - name: Check SDK build paths
        shell: pwsh
        run: |
          $name = if ($IsWindows) { 'LumaRecodeCore.dll' } else { 'libLumaRecodeCore.dylib' }
          $binary = "out/native-${{ matrix.cpu }}-release/engine/$name"
          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD $binary))
          $content = [Text.Encoding]::Latin1.GetString($bytes)
          $roots = @($PWD.Path, $PWD.Path.Replace('\', '/'), $PWD.Path.Replace('/', '\')) | Sort-Object -Unique
          foreach ($root in $roots) {
            foreach ($encoding in @([Text.Encoding]::UTF8, [Text.Encoding]::Unicode)) {
              $pattern = [Text.Encoding]::Latin1.GetString($encoding.GetBytes($root))
              if ($content.Contains($pattern, [StringComparison]::Ordinal)) {
                throw 'SDK binary contains an absolute build workspace path.'
              }
            }
          }
          Write-Output 'SDK build path check passed.'
      - name: Build Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Target Native -Compilation Jit
      - name: Windows application regression checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project qa/BackendChecks -c Release -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project qa/PerformanceChecks -c Release -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/RuntimeChecks/check_shared_host.py --exe dist/SelfContained/LumaRecode.exe
          exit $LASTEXITCODE
      - name: Windows development application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-windows-${{ matrix.cpu }}-development
          retention-days: 14
          if-no-files-found: error
          path: dist/SelfContained/LumaRecode.exe
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          xcrun swift --version
          sh tools/build-macos.sh Release --dmg
      - name: macOS application regression checks
        if: runner.os == 'macOS'
        run: python3 qa/RuntimeChecks/check_macos_host.py --app out/macos-build/Build/Products/Release/LumaRecode.app
      - name: macOS development application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-macos-arm64-development
          retention-days: 14
          if-no-files-found: error
          path: out/macos-build/LumaRecode-ARM64.dmg
      - name: SDK artifact
        shell: pwsh
        run: |
          $build = "out/native-${{ matrix.cpu }}-release"
          $sdk = Join-Path $env:RUNNER_TEMP 'lumarecode-sdk'
          cmake --install $build --config Release --prefix $sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "$build/engine/build-info.json" -Destination $sdk -ErrorAction Stop
          Copy-Item -LiteralPath 'engine/examples' -Destination $sdk -Recurse -ErrorAction Stop
          $platform = if ($IsWindows) { 'Windows' } else { 'macOS' }
          $name = "LumaRecode-SDK-$platform-${{ matrix.cpu }}.zip"
          Compress-Archive -Path "$sdk/*" -DestinationPath (Join-Path $env:RUNNER_TEMP $name) -ErrorAction Stop
      - name: Upload SDK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-core-${{ runner.os }}-${{ matrix.cpu }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/LumaRecode-SDK-*-${{ matrix.cpu }}.zip

  distribution:
    name: Verify distribution provenance
    needs: core
    # The build matrix also runs for pull requests. Only maintainer-dispatched
    # builds from the project repository have the signing permissions.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'MIKU552/LumaRecode' &&
      (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build
      - name: Collect exact distribution files
        run: |
          mkdir distribution
          cp build/lumarecode-windows-x64-development/LumaRecode.exe distribution/LumaRecode-Windows-x64-JIT.exe
          cp build/lumarecode-windows-arm64-development/LumaRecode.exe distribution/LumaRecode-Windows-arm64-JIT.exe
          cp build/lumarecode-macos-arm64-development/LumaRecode-ARM64.dmg distribution/LumaRecode-macOS-arm64.dmg
          cp build/native-core-Windows-x64/LumaRecode-SDK-Windows-x64.zip distribution/
          cp build/native-core-Windows-arm64/LumaRecode-SDK-Windows-arm64.zip distribution/
          cp build/native-core-macOS-arm64/LumaRecode-SDK-macOS-arm64.zip distribution/
      - name: Attest the final files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: distribution/*
      - name: Verify signatures and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in distribution/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-core.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Upload verified distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-distribution-${{ github.sha }}
          if-no-files-found: error
          path: distribution/*
