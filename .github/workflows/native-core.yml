name: Native core

on:
  pull_request:
    branches: [main, next]
  workflow_dispatch:
    inputs:
      release_packages:
        description: Build the complete release candidate and Store upload
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_packages:
        type: boolean
        required: true

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025-vs2026
            cpu: x64
            msys: UCRT64
            msys_prefix: mingw-w64-ucrt-x86_64
          - name: Windows ARM64
            os: windows-11-vs2026-arm
            cpu: arm64
            msys: CLANGARM64
            msys_prefix: mingw-w64-clang-aarch64
          - name: macOS 27 ARM64
            os: xcode-27
            cpu: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
      - name: Install pinned build tools
        shell: pwsh
        run: ./tools/Install-NativeBuildTools.ps1 -Directory "${{ runner.temp }}/lumarecode-build-tools"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Managed source formatting
        if: runner.os == 'Windows' && matrix.cpu == 'x64'
        shell: pwsh
        run: |
          dotnet format Interop/LumaRecode.Native.csproj --verify-no-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format Core/LumaRecode.Core.csproj --verify-no-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format qa/NativeCoreChecks/NativeCoreChecks.csproj --verify-no-changes
          exit $LASTEXITCODE
      - name: Rust formatting and lints
        shell: pwsh
        run: |
          cargo fmt --all --manifest-path engine/rust/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path engine/rust/Cargo.toml --workspace --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Build and test Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Build-NativeCore.ps1 -Target Native -Configuration Release -Test
      - name: Build and test macOS core
        if: runner.os == 'macOS'
        run: sh tools/build-native-core.sh Release
      - name: Install pinned media test tools
        shell: pwsh
        run: ./tools/Install-MediaTestTools.ps1 -Directory "${{ runner.temp }}/lumarecode-media-tools"
      - name: Managed/native differential checks
        env:
          LUMA_REQUIRE_MEDIA_TOOLS: '1'
        shell: pwsh
        run: |
          $library = if ($IsWindows) { 'LumaRecodeCore.dll' } else { 'libLumaRecodeCore.dylib' }
          dotnet run --project qa/NativeCoreChecks/NativeCoreChecks.csproj -c Release -- "out/native-${{ matrix.cpu }}-release/engine/$library"
          exit $LASTEXITCODE
      - name: Check SDK build paths
        shell: pwsh
        run: |
          $name = if ($IsWindows) { 'LumaRecodeCore.dll' } else { 'libLumaRecodeCore.dylib' }
          $binary = "out/native-${{ matrix.cpu }}-release/engine/$name"
          $bytes = [IO.File]::ReadAllBytes((Join-Path $PWD $binary))
          $content = [Text.Encoding]::Latin1.GetString($bytes)
          $roots = @($PWD.Path, $PWD.Path.Replace('\', '/'), $PWD.Path.Replace('/', '\')) | Sort-Object -Unique
          foreach ($root in $roots) {
            foreach ($encoding in @([Text.Encoding]::UTF8, [Text.Encoding]::Unicode)) {
              $pattern = [Text.Encoding]::Latin1.GetString($encoding.GetBytes($root))
              if ($content.Contains($pattern, [StringComparison]::Ordinal)) {
                throw 'SDK binary contains an absolute build workspace path.'
              }
            }
          }
          Write-Output 'SDK build path check passed.'
      - name: Build Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Target ${{ matrix.cpu }} -Compilation Aot
      - name: Windows application regression checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project qa/BackendChecks -c Release -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project qa/PerformanceChecks -c Release -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python qa/RuntimeChecks/check_shared_host.py --exe dist/Aot-SelfContained-${{ matrix.cpu }}/LumaRecode.exe
          exit $LASTEXITCODE
      - name: Windows development application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-windows-${{ matrix.cpu }}-development
          retention-days: 14
          if-no-files-found: error
          path: dist/Aot-SelfContained-${{ matrix.cpu }}/LumaRecode.exe
      - name: Build Windows application without bundle extraction
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && github.repository == 'MIKU552/LumaRecode'
        shell: pwsh
        run: |
          ./build.ps1 -Target ${{ matrix.cpu }} -Compilation Aot -Deployment Portable
          python qa/RuntimeChecks/check_shared_host.py --exe dist/Aot-Portable-${{ matrix.cpu }}/LumaRecode.exe --portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:LUMA_RELEASE_PACKAGES -ne 'true') {
            $archive = Get-Item 'dist/*-win-${{ matrix.cpu }}-aot-portable.zip' -ErrorAction Stop
            Copy-Item -LiteralPath $archive.FullName -Destination "${{ runner.temp }}/LumaRecode-Windows-${{ matrix.cpu }}-Portable.zip" -ErrorAction Stop
          }
        env:
          LUMA_RELEASE_PACKAGES: ${{ inputs.release_packages }}
      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && github.repository == 'MIKU552/LumaRecode' && !inputs.release_packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-windows-${{ matrix.cpu }}-portable
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/LumaRecode-Windows-${{ matrix.cpu }}-Portable.zip
      - name: Install MSYS2 FFmpeg for redistribution
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && github.repository == 'MIKU552/LumaRecode' && inputs.release_packages
        id: ffmpeg
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: ${{ matrix.msys }}
          update: true
          cache: false
          install: ${{ matrix.msys_prefix }}-ffmpeg ${{ matrix.msys_prefix }}-vulkan-loader
      - name: Build and check Windows release formats
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && github.repository == 'MIKU552/LumaRecode' && inputs.release_packages
        shell: pwsh
        env:
          LUMA_MSYS_ROOT: ${{ steps.ffmpeg.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $cpu = '${{ matrix.cpu }}'
          $formats = Join-Path $env:RUNNER_TEMP 'windows-release'
          $store = Join-Path $env:RUNNER_TEMP 'windows-store'
          $toolsOutput = Join-Path $env:RUNNER_TEMP 'ffmpeg-redistribution'
          python -m pip install --require-hashes --no-deps -r tools/ffmpeg-windows-build-requirements.txt
          python tools/stage_windows_ffmpeg.py --arch $cpu --msys $env:LUMA_MSYS_ROOT --output $toolsOutput
          $tools = Join-Path $toolsOutput FFmpeg
          $env:LUMA_TEST_FFMPEG = Join-Path $tools 'bin/ffmpeg.exe'
          $env:LUMA_TEST_FFPROBE = Join-Path $tools 'bin/ffprobe.exe'
          # Run the conversion checks against the packaged DLL closure.
          $python = (Get-Command python).Source
          $buildPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot/system32;$env:SystemRoot;$PSHOME"
            & $python qa/RuntimeChecks/check_shared_host.py --exe "dist/Aot-Portable-$cpu/LumaRecode.exe" --portable
            $filters = & $env:LUMA_TEST_FFMPEG -hide_banner -filters | Out-String
          } finally { $env:PATH = $buildPath }
          foreach ($filter in @('zscale', 'lut3d', 'libplacebo')) {
            if ($filters -notmatch "\b$filter\b") { throw "Bundled FFmpeg is missing $filter." }
          }
          ./tools/Package-Windows.ps1 -Target $cpu -Profile Aot -Ffmpeg Both -FfmpegDirectory $tools -OutputDirectory $formats -SkipBuild
          ./tools/Package-Windows.ps1 -Target $cpu -PartnerCenter -Format Msix -Ffmpeg Bundled -FfmpegDirectory $tools -OutputDirectory $store -SkipBuild
          ./tools/Package-Windows.ps1 -Target $cpu -Profile JitExternal -Ffmpeg Both -FfmpegDirectory $tools -OutputDirectory $formats
          $single = (Get-Item (Join-Path $formats '*-jitexternal-ffmpeg-external.exe')).FullName
          python qa/RuntimeChecks/check_framework_host.py --arch $cpu $single "dist/FrameworkDependent-$cpu/LumaRecode.exe"
          Copy-Item -LiteralPath (Join-Path $toolsOutput "LumaRecode-Windows-$cpu-FFmpeg-Sources.zip") -Destination $formats
      - name: Upload Windows release formats
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && github.repository == 'MIKU552/LumaRecode' && inputs.release_packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-windows-${{ matrix.cpu }}-release
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/windows-release/*
      - name: Upload Windows Store architecture slice
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && github.repository == 'MIKU552/LumaRecode' && inputs.release_packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-windows-${{ matrix.cpu }}-store
          if-no-files-found: error
          path: ${{ runner.temp }}/windows-store/*.msix
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          xcrun swift --version
          sh tools/build-macos.sh Release
      - name: macOS application regression checks
        if: runner.os == 'macOS'
        env:
          LUMA_REQUIRE_VIDEO_TOOLBOX_DOVI: '1'
        run: python3 qa/RuntimeChecks/check_macos_host.py --app out/macos-build/Build/Products/Release/LumaRecode.app
      - name: Package verified macOS application
        if: runner.os == 'macOS'
        run: sh tools/build-macos.sh Release --dmg-only
      - name: macOS development application
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-macos-arm64-development
          retention-days: 14
          if-no-files-found: error
          path: out/macos-build/LumaRecode-ARM64.dmg
      - name: Package macOS with FFmpeg Full
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && github.repository == 'MIKU552/LumaRecode'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          LUMA_VALIDATE_FULL_FFMPEG: '1'
        run: |
          HOMEBREW_FORCE_API_AUTO_UPDATE=1 HOMEBREW_API_AUTO_UPDATE_SECS=0 brew install ffmpeg-full molten-vk
          version="$("$(brew --prefix ffmpeg-full)/bin/ffmpeg" -version | sed -n '1s/^ffmpeg version \([^ ]*\).*/\1/p')"
          if [ "$version" != '9.1' ]; then
            echo "Expected reviewed FFmpeg 9.1. Homebrew supplied $version." >&2
            exit 1
          fi
          sh tools/build-macos.sh Release --dmg-full-tools
      - name: macOS application with FFmpeg Full and sources
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && github.repository == 'MIKU552/LumaRecode'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-macos-arm64-ffmpeg-full
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            out/macos-build/LumaRecode-ARM64-FFmpeg-Full.dmg
            out/macos-build/FFmpeg-Full-Sources.tar.gz
      - name: SDK artifact
        shell: pwsh
        run: |
          $build = "out/native-${{ matrix.cpu }}-release"
          $sdk = Join-Path $env:RUNNER_TEMP 'lumarecode-sdk'
          cmake --install $build --config Release --prefix $sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "$build/engine/build-info.json" -Destination $sdk -ErrorAction Stop
          Copy-Item -LiteralPath 'engine/examples' -Destination $sdk -Recurse -ErrorAction Stop
          $platform = if ($IsWindows) { 'Windows' } else { 'macOS' }
          $name = "LumaRecode-SDK-$platform-${{ matrix.cpu }}.zip"
          Compress-Archive -Path "$sdk/*" -DestinationPath (Join-Path $env:RUNNER_TEMP $name) -ErrorAction Stop
      - name: Upload SDK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-core-${{ runner.os }}-${{ matrix.cpu }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/LumaRecode-SDK-*-${{ matrix.cpu }}.zip

  distribution:
    name: Verify distribution provenance
    needs: core
    # The build matrix also runs for pull requests. Only maintainer-dispatched
    # builds from the project repository have the signing permissions.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'MIKU552/LumaRecode' &&
      (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build
      - name: Collect exact distribution files
        env:
          LUMA_RELEASE_PACKAGES: ${{ inputs.release_packages }}
        run: |
          set -euo pipefail
          mkdir distribution
          if [[ "$LUMA_RELEASE_PACKAGES" == true ]]; then
            cp build/lumarecode-windows-{x64,arm64}-release/* distribution/
            test "$(find distribution -maxdepth 1 -type f | wc -l)" -eq 26
          else
            cp build/lumarecode-windows-x64-development/LumaRecode.exe distribution/LumaRecode-Windows-x64-AOT.exe
            cp build/lumarecode-windows-arm64-development/LumaRecode.exe distribution/LumaRecode-Windows-arm64-AOT.exe
            cp build/lumarecode-windows-{x64,arm64}-portable/*.zip distribution/
          fi
          cp build/lumarecode-macos-arm64-development/LumaRecode-ARM64.dmg distribution/LumaRecode-macOS-arm64.dmg
          cp build/lumarecode-macos-arm64-ffmpeg-full/LumaRecode-ARM64-FFmpeg-Full.dmg distribution/LumaRecode-macOS-arm64-FFmpeg-Full.dmg
          cp build/lumarecode-macos-arm64-ffmpeg-full/FFmpeg-Full-Sources.tar.gz distribution/LumaRecode-macOS-FFmpeg-Full-Sources.tar.gz
          cp build/native-core-Windows-x64/LumaRecode-SDK-Windows-x64.zip distribution/
          cp build/native-core-Windows-arm64/LumaRecode-SDK-Windows-arm64.zip distribution/
          cp build/native-core-macOS-arm64/LumaRecode-SDK-macOS-arm64.zip distribution/
          (cd distribution && sha256sum -- * > SHA256SUMS.txt.unpublished)
          mv distribution/SHA256SUMS.txt.unpublished distribution/SHA256SUMS.txt
      - name: Attest the final files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: distribution/*
      - name: Verify signatures and source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in distribution/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/native-core.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Upload verified distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-distribution-${{ github.sha }}
          if-no-files-found: error
          path: distribution/*

  store:
    name: Assemble Microsoft Store upload
    needs: core
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'MIKU552/LumaRecode' && inputs.release_packages
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lumarecode-windows-*-store
          path: build
      - name: Bundle the verified Store identity
        shell: pwsh
        run: |
          $x64 = (Get-Item 'build/lumarecode-windows-x64-store/*.msix' -ErrorAction Stop).FullName
          $arm = (Get-Item 'build/lumarecode-windows-arm64-store/*.msix' -ErrorAction Stop).FullName
          ./tools/New-StoreBundle.ps1 -X64 $x64 -Arm64 $arm -OutputDirectory store
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: store/*.msixupload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumarecode-store-${{ github.sha }}
          if-no-files-found: error
          path: store/*.msixupload
